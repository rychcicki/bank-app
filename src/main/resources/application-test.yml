spring:
  datasource:
    url: jdbc:h2:mem:testdb
#    url: jdbc:h2:file:./src/main/resources/dump/testdb;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      format_sql: true
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
#      ddl-auto: validate
      ddl-auto: none
    show-sql: true
  logging:
    pattern:
      console: "%msg%n"
    level:
      org.springframework.web: INFO
      guru.springframework.controllers: INFO
      org.hibernate: INFO
  cloud:
    openfeign:
      client:
        config:
          rateClient:
            url: "http://api.nbp.pl/api/exchangerates/rates/a/"
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
#  servlet:
#    context-path: /bank
age-of-majority: 18

application:
  security:
    basic:
      enabled: true
      authorize-mode: NONE
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
      refresh-token:
        expiration: 604800000

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header